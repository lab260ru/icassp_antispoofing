# Central state for the AR-TTS counting-collapse study.
# A fresh agent should be able to resume from THIS FILE + findings.md + README.md.
project: "Counting Collapse in Autoregressive TTS"
venue: "ICASSP 2026 (4 pages + 1 page refs)"
started: "2026-08-11"
branch: "research/ar-tts-counting-collapse"
remote: "https://github.com/lab260ru/icassp_antispoofing"

question: >
  Autoregressive TTS models mis-render text containing many repetitions
  (looping, truncating, losing count). Is this a structural consequence of the
  decoder's state dynamics under periodic conditioning rather than a sampling
  artifact? If the per-repetition state map contracts, the model provably
  cannot count past a finite horizon.

phase: "P4-ship"   # P0 scaffold, P1 bringup, P2 sweep, P3 refinement, P4 ship

# ---------------------------------------------------------------- what is done
settled:
  lean: >
    COMPLETE and verified. 11 theorems in lean/SpectralTTS, zero sorry, axiom
    audit shows only propext / Classical.choice / Quot.sound. Gate:
    scripts/check_lean.sh. Do not re-derive; it is finished.
  theory: >
    Theorem A (i)-(iv) counting collapse + Lemma B attention dilution. The Lean
    artifact proves an IMPLICATION; the contraction premise is empirical and
    was MEASURED AND REFUTED on Llasa-1B on 2026-08-12, then the refutation was
    GENERALISED (still 2026-08-12, later that day) to five checkpoints across
    both architecture families -- q in [21,348], q<1 in zero items on either
    arm anywhere -- see findings_headline.contraction_premise below, whose
    single-checkpoint scope note is now itself superseded. Not merely
    "unestablished" any more, and not single-checkpoint any more either.
    Section 4 is retitled "The Candidate Mechanism, Measured and Refuted" and
    was moved from Section 2 to after the results, compressed to about half
    its former length; the paper's title dropped "Autoregressive" and then the
    theorem-forward framing entirely (now "Periodicity, Not Length: Locating
    the Repetition-Counting Failure in Neural Text-to-Speech" -- a period
    ladder tested this title directly on 2026-08-12/13, see
    findings_headline.period_ladder, and it held: "so the title stands"). The
    stimulus ladder is presented as an instrument, not a benchmark/suite -- do
    not restore either the attractor-theory framing or the benchmark framing.
    Keep the implication/premise distinction explicit in all writing --
    reviewers rewarded it, and it is now what lets the paper report a measured
    refutation instead of an unresolved assumption.
    THE CHAIN FAILS AT BOTH ENDS, not just at the q link: the derivation is
    bounded-delta logits -> near-uniform attention -> autonomous map F ->
    contraction, and Lemma B's own measured delta (1.23 nats, a 3.4-fold
    attention-weight ratio across the repeated spans -- \DeltaMax{} in
    numbers.tex, restored to the paper's Section 4 prose on 2026-08-12 after
    sitting unused since a page-budget cut removed the sentence quoting it) is
    not the near-uniformity the lemma assumes either. So the flattening the
    lemma needs is absent and the map that flattening would license does not
    contract. Do not write "the premise fails" as if only the q measurement
    were doing the work; both links fail independently.
  benchmark: >
    180 stimuli, data/stimuli/stimuli.jsonl, regenerable by make_stimuli.py.
    Regenerating only changes metadata, never text, so existing generations
    stay valid.
  behavioural_pipeline: "generate -> vocode (Llasa only) -> Whisper -> score_counts"

# --------------------------------------------------------------- key findings
# ALL numbers below are CTC-judged on the population defined by
# src/common/population.py (ablations, degenerate audio, judge-unmeasurable
# template t2, and items truncated by our own token budget all excluded).
# Whisper-judged numbers from before 2026-08-12 are superseded; see findings.md.
findings_headline:
  dissociation: >
    Repeated text is miscounted where length-matched controls are not. At k>=6:
    repeated median relative error -8.3% [-12.5,-6.2] n=457, control 0.0
    [0.0,0.0] n=525. Exact-rate is the sharper statement: 94.3% of control
    generations come back exactly right against 18.2% of repeated ones.
    Separated from own control in 4 of 6 checkpoints.
  horizon: >
    THE MAIN LADDER WAS TOO SHORT. Within k<=32 the count is proportional
    (c = 0.95k, SSE 2.6 against 485 for a constant), so no horizon is visible.
    The extension ladder k=48..128 finds it. FINISHED NUMBERS (4 checkpoints,
    2 families, 21-26 items/cell, data/results/horizon_ext.json, soft-horizon
    fit): the repeated median is FLAT from k=48 to 128 while controls climb.
    Controls saturate too -- these decoders have a general utterance-length
    ceiling -- so the reportable quantity is the RATIO, which divides it out:
    N*_rep 24.8 [22.5,42.4] vs N*_ctl 104.8 [93.3,114.8], pooled ratio 4.22.
    Disjoint per-checkpoint CIs for llasa1b (ratio 5.97) and llasa8b (4.12);
    qwen06b (13.1) still has a repeated CI unbounded at the fit ceiling
    (hi=4000) and qwen17b INVERTS it (0.29) -- the same checkpoint with no
    deficit at k<=32. Magnitude is form-dependent across the three fitted
    families -- pooled ratio 3.1 (tanh) to 5.4 (hyperbolic),
    analysis/horizon_forms.py; direction is not (qwen17b is the only
    checkpoint below 1, under all three forms).
    NEVER quote a repeated horizon without its matched control horizon.
    SUPERSEDED 2026-08-12 by the qwen_gen.py `hit_cap` off-by-one repair (see
    mechanism_status below for the bug): "N*_rep 30.1 [23.8,45.9], pooled
    ratio 3.5, qwen06b ratio 15.0, qwen17b ratio 0.27, form range 2.7-4.3".
    `hit_cap` was False on every Qwen row ever generated, so budget-truncated
    (count-censored) repeated items were never excluded and were inflating the
    repeated arm's fitted saturation scale -- the fix moves the ratio in the
    paper's own favour. Do not requote the 3.5 / 15.0 / 0.27 numbers.
    SUPERSEDED (older, 2-checkpoint morning numbers, predates the extension to
    4 checkpoints): "medians fall 27 -> 15", "controls saturate near 60",
    "N*_rep 23 [16,39] / N*_ctl 94 [71,111] / ratio 4.1". The decline past the
    plateau was a small-n artifact.
  mechanism: >
    Capacity gain dN_eff/dlog k on repeated text is 0.46x the control gain,
    disjoint 95% template-bootstrap CIs in 5 of 6. Crucially the gain stays
    POSITIVE in 5 of 6: repetition slows state acquisition, it does not halt it,
    which is consistent with decoders below their horizon at k<=32.
  lemma_b: >
    Renormalised over the k repeated keys, block entropy grows as 0.97 log k and
    the within-block share falls with log-log slope -1.00. TWO DELTAS, labelled:
    the entropy gap max(log k - H) bounds the AVERAGE spread (<= 0.45 nats); the
    most-attended occurrence bounds the EXTREME (share <= 3.4/k worst case ->
    delta <= 1.23; 1.7/k typical -> delta 0.51). The lemma needs the EXTREME and
    is entitled only to it: quote delta <= 1.23 / 3.4-over-k. Do not quote the
    average as though it were the bound -- an earlier draft did, and it read as
    inconsistent. Source: data/results/state.csv via analysis/make_numbers.py
    (macros DeltaEntropy, DeltaMax, ShareMaxK, ShareMedK, DeltaMedian).
    SUPERSEDED, pre-renormalisation: "0.98 log k, delta <= 0.06, 1.9/k".
  negative_results: >
    SUPERSEDED FRAMING, kept for the failed-attempt record (see
    contraction_premise below for the current status): (1) The
    boundary-difference estimator for q is unsound here: deep-layer attention
    centroid advances on ~51% of steps -- and reproduces q~1 at R^2=0.02 when
    rerun with uniform-partition boundaries instead of attention-derived ones,
    so this was not a localisation artifact. (2) A finite-difference
    perturbation probe (analysis/contraction_probe.py) found NO difference in
    local contraction between repeated items and controls -- 7 of 18 pairs in
    the predicted direction, p=0.12, replicated at two injection depths, its
    own linearity control failing at h=1e-3 for float32 roundoff reasons (a
    unit vector over 2.5M coordinates moves each coordinate by ~1e-6). Both of
    these said "unmeasured", not "false" -- that changed 2026-08-12. Do not
    present either of these two q-hats as validated; they were superseded by a
    third, gated estimator, not corroborated by it.
  contraction_premise: >
    MEASURED AND REFUTED as of 2026-08-12, and the refutation GENERALISES --
    panel-wide as of 2026-08-12 (later that day), not single-checkpoint any
    more. analysis/jacobian_q.py: exact-JVP power iteration on the
    boundary-to-boundary Jacobian, gated by its own self-tests before being
    pointed at the model (synthetic-spectrum recovery 3.8e-4; causality check
    exactly 0.000000 backward on every checkpoint incl. Qwen; JVP-vs-finite-
    difference agreement 2e-5 in the linear range).
    FIVE CHECKPOINTS, TWO FAMILIES (data/results/jacobian_q_panel.json, which
    aggregates the per-checkpoint files -- verified 2026-08-13 against that
    JSON directly): 346 items, 14,796 measurements.
      llasa1b   q= 38.1 [32.9, 51.4]   control 31.8   (n=29)
      llasa3b   q=118.8 [101.9,156.5]  control 86.4   (n=26)
      llasa8b   q=347.7 [258.1,393.5]  control 185.4  (n=29)
      qwen06b   q= 21.0 [19.7, 24.2]   control 21.9   (n=44)
      qwen17b   q= 24.7 [23.1, 25.7]   control 23.6   (n=45)
    q<1 in ZERO items, in every checkpoint, every lag, every sub-stack, on
    both arms. Weakest cell floor is 3.3 (min_q_ci_lo_any_cell across the
    panel); teacher-forcing makes every one of these a LOWER bound on the true
    per-repetition Lipschitz constant, so q>>1 is decisive, not marginal.
    N* is not computable for any of the five (Eq. 1 undefined for q>=1).
    TWO FACTS SHARPEN IT PAST REPLICATION. (1) q GROWS WITH SCALE inside
    Llasa: 38 -> 119 -> 348 at 1B -> 3B -> 8B -- the reviewer's "maybe only the
    larger checkpoints contract" is excluded in the strongest available
    direction, since scale moves q the wrong way. (2) QWEN3-TTS-1.7B COUNTS
    CORRECTLY (the panel's one zero-median-count-error checkpoint) AND HAS
    q=24.7, as expansive as everything else -- whatever separates counting
    from miscounting on this panel, it is not q.
    Per-arm: both arms are expansive in all 5x16=80 lag x sub-stack cells; the
    repeated-vs-control contrast is significant in the WRONG direction on
    Llasa-1B only (paired_wilcoxon_p=0.0168, matches the paper's dropped
    \JacQPairedP macro -- the p-value itself was cut from the prose in the r22
    pass since the paper's claims rest on effect size, not p, but the macro
    still exists and still equals 0.017) and null on the other four
    (Llasa-3B p=0.269, Llasa-8B p=0.256, Qwen-0.6B p=0.931, Qwen-1.7B p=0.177).
    So the deflationary reading generalises too, stated outright in the paper:
    contraction was never a description of ANY of these five decoders, for
    ANY input.
    ENGINEERING NOTE on how Qwen was measured at all: it has no token sequence
    to teacher-force (each step's input sums 16 RVQ codec embeddings plus a
    text term, and codec ids are never saved), so a 4th self-test gate (S4)
    captures the actual fused input via a pre-hook and requires it to
    reproduce incremental generation to cosine 0.999; re-generation reproduced
    the ledger's token counts 88/88 and 90/90 (this pairing is cited from the
    931d349 commit message, not found as a field in any committed JSON --
    flag its provenance if requoting). Llasa-8B skipped 22% of its
    measurements at a 700-token read window on one card -- 236/365 of those
    skips are exact read-window truncation (fine on a causal model) but 129
    are plain OOM (not covered by that argument); S5 in the supplement reports
    both counts separately rather than the single "read-window" story an
    earlier commit message gave. Llasa-3B ran before a MIN_TAU sample-rate
    patch that matters at Qwen's 12.5 Hz (an 8-frame floor is 0.16s at Llasa's
    50Hz but 0.6s at Qwen's 12.5Hz, which would have silently discarded nearly
    every Qwen item) -- the patch's bias runs toward the premise, not against
    it.
    THE SHARPER, LESS FLATTERING READING (added after r19 review, now in the
    abstract and Section 4, and now panel-wide rather than one-checkpoint):
    control arms are ALSO expansive everywhere, so the contraction premise was
    never a live description of any of these decoders for ANY input -- this is
    not "periodicity breaks contraction", it is "there was no contraction here
    to break".
    SCOPE, now CLOSED: the r19 single-checkpoint caveat below is SUPERSEDED as
    of the 931d349 commit (five checkpoints, two families, no exceptions). Old
    text kept for the record: ~~false for the ONE decoder measured (n=29,
    Llasa-1B), not "false for these decoders" plural and not panel-wide~~.
  mechanism_status: >
    All four mechanistic candidates raised across this project have now been
    tested and none stands, which the paper says outright: "no mechanistic
    spine available on this evidence." (1) CONTRACTION -- measured and
    refuted, and as of 2026-08-12 (later) the refutation GENERALISES to all
    five checkpoints measured across two families (q in [21,348], q<1 nowhere;
    see contraction_premise -- its "Llasa-1B only" scope note is superseded).
    The derivation's other end fails too: Lemma B's own measured delta (1.23
    nats / 3.4-fold, restored to the paper 2026-08-12) is not the
    near-uniformity the lemma needs, so "bounded-delta -> near-uniform
    attention -> autonomous map -> contraction" fails at its first link as
    well as its last. (2) DILUTION dose-response --
    disconfirmed, SIGN-REVERSED: within a (model,k) cell, flatter attention
    counts BETTER, not worse (r=+0.59 [0.35,0.75], all three flatness
    measures, controls at zero; analysis/dilution_sufficiency.py). (3)
    STOP-HEAD readout -- negative. Instrumentation is sound (EOS logits exact
    to 0.075 nats against the instrumented pass, all 4 planted positive
    controls recovered with zero spurious attribution, commonality
    decomposition additive to 1e-16) but duration/count predictors are
    INSEPARABLE on Llasa-1B (canonical correlation 0.970 at low k, above the
    pre-committed 0.95 threshold) and INCONCLUSIVE on Llasa-8B (0.635) -- the
    two checkpoints disagree on which direction the collinearity even moves.
    analysis/stop_head.py, data/results/stop_head.json. (4) CAUSAL
    INTERVENTION -- attempted twice. Whole-state splicing
    (data/results/causal_count.json) came back "too disruptive to interpret":
    states from an UNRELATED donor moved the rendered count 1.34x as much as
    an informative one (cap-hit 15.8% reference vs 37.4% patched). A rank-1
    patch transplanting only the probe's count coordinate
    (data/results/causal_count_followup.json) fixed the instrument -- no-op
    self-patch bitwise-identical 18/18, 0% degenerate in every patched cell,
    stop-rate within 3-17 points of reference -- and reads as a CLEAN NULL:
    cross-k at layer 7, +0.00 log-count [-0.09,+0.09], n=36 pairs, no
    opposite-sign up/down pattern anywhere. The ridge-steering lead that
    looked promising in the pilot DIED on a full sweep: Spearman +0.044
    [p=0.65] over 274 generations x 9 alphas; the repeated curve is
    non-monotone (peaks mid-sweep at ~15-16 rendered, collapses to 3-6 at both
    extremes) while length-matched controls stay flat (24 rendered units at
    every alpha). CAVEAT: the pre-committed P1 disruption gate on the rank-1
    patch still literally returns "too disruptive" at 1.74 -- reported as
    such, but flagged post-hoc as a degenerate ratio (both arms' extreme-alpha
    effect medians are exactly 0.0, so the gate divides by ~nothing rather
    than detecting violence). WHAT STANDS: the causal half of the
    dissociation the reframed title claims -- the state represents the count
    (the probe, where the horizon permits it) and the decoder demonstrably
    ignores that representation when it is transplanted (rank-1 patch): an
    output-policy account, not a state-erasure one.
  nonar_baseline: >
    VITS (facebook/mms-tts-eng), src/models/vits_gen.py, run on the same ladder
    shows NO dissociation: 65.6% of repeated items exact against 58.9% of
    controls, gap -6.7 pts where the AR panel's is +76.1, and all 6 AR
    checkpoints separate from it. It degrades with length on both families
    alike. This rules out "long repeated text is just hard" AND clears the CTC
    judge -- blank-collapse would have depressed VITS's repeated items too.
    Run this before trusting any judge result on repeated speech.
  judge: >
    CTC (wav2vec2-large-960h-lv60-self), never Whisper. On real generated audio
    Whisper emits 10.7-12.3 words/sec at k>=24, which is not physically speech.
    CTC's own limit: blank-collapse can merge adjacent identical words, which
    depresses repeated counts but not control counts -- it inflates our reported
    gap rather than manufacturing it, so magnitudes at k>=16 are approximate.
  judge_replication: >
    2026-08-12: the CTC-judge objection (eight of nine r15-r17 reviewers, two
    more in r18) is answered with three more recognisers, not argued away.
    analysis/independent_judge.py, data/results/independent_judge.json, same
    982 generations, k>=6. Per-checkpoint mean exact-rate gap: wav2vec2-large-
    960h-lv60-self (primary) +76.7, hubert-large-ls960-ft (independent) +72.3,
    whisper-large-v3 (no blank-collapse mechanism at all) +75.5, wav2vec2-
    large-robust-ft-libri-960h (weakest) +65.1. Positive in 6/6 checkpoints
    and 3/3 families under every one of the four. THE DECISIVE ARGUMENT is the
    arm spread, not the gap size: across the four judges the repeated arm's
    exact rate spans 1.0 point (17.1-18.2%) while the control arm's spans 12.2
    (82.1-94.3%) -- swapping the scorer moves the arm the models get right
    (word-error-rate noise) and leaves the arm they get wrong almost exactly
    where it was, the opposite of what judge-side blank-collapse of repeated
    material would produce. Disagreement is real and reported: judges disagree
    3.3x more on repeated items than controls, growing with k (exact
    agreement on repeated items falls 94-97% at k<=8 to 64.4% at k=32) -- but
    its SIGN is wrong for the confound: the primary judge reports the HIGHER
    count in 61.2% of repeated-item disagreements and 72.9% of control ones
    (65.9% pooled all-k), i.e. it under-states the deficit, not manufactures
    it. Under the strongest form of the objection (either judge counting as
    exact) the gap widens to +76.2, not narrows.
    SUPERSEDES noise_floor.py's "our judge reports the higher count in 11 of
    13 disagreements" (n=60, an optimistic small-n figure). At full n
    (173 disagreements out of 1559 paired rows) it is 61-73% depending on arm,
    not 85% (11/13). Still the right side of 50, but do not requote 11/13; S14
    in the supplement retires it in place, marked superseded.
  cosyvoice2_heldout: >
    2026-08-12: CosyVoice 2 (alignment-supervised, autoregressive) lands as a
    FOURTH architecture -- scored and reported separately from the 6-checkpoint
    panel, listed by name in population.py's non-panel set so a routine rerun
    of run_pipeline.sh cannot silently fold it in and move every panel macro.
    It is a genuine held-out test of the hierarchical fit: the posterior
    predictive gap for an architecture outside the panel
    (hierarchical.json:new_family_gap_pts, committed 6f34945 at 17:28) was
    65.3 [5.9,93.3] points, P(gap>0)=0.996, BEFORE CosyVoice 2's first
    waveform existed (18:58). Observed: 64.4 points (28.9% repeated exact vs
    93.3% control, n=90/arm, k>=6, data/results/behavioural_cosyvoice.csv
    through the same population.panel() logic). It is the design most likely
    to be immune (alignment supervision, repetition-aware sampling) and is not
    immune -- but it fails DIFFERENTLY: it OVER-produces (median repeated
    relative error +12.5%, i.e. too much speech rather than too little) at a
    0% cap-hit rate, its generation ceiling scaling with the text instead of
    being fixed, so it makes roughly the right amount of speech and still
    loses the count.
    PRECISION CAVEAT the paper now states explicitly: the predictive interval
    is ~90 points wide and includes zero under the single widest group-level-
    scale prior tried (HalfNormal(3.0): lower bound -1.63, P(gap>0)=0.956) --
    landing within 0.9 points of the point estimate is luckier than the model
    is entitled to claim credit for. Report as a HELD-OUT PREDICTION, not a
    pre-registration: generation was already queued when the fit was
    committed, so the architecture was chosen, only its result was unknown.
  hierarchical_stats: >
    2026-08-12: analysis/hierarchical.py, data/results/hierarchical.json.
    Mixed-effects linear-probability model (architecture random effect): arm
    gap 76.4 pts; six interval constructions (Wald, cluster-family, cluster-
    checkpoint, GEE, family-t, two cluster bootstraps) all exclude zero, LEAST
    FAVOURABLE lower bound 63.2 pts (cluster-checkpoint, t(5) -- the Wald/REML
    interval is narrower and marked reference-only because REML over-shrinks
    the family-varying arm-slope SD with only 3 families). Hierarchical Bayes
    (numpyro NUTS, rhat<=1.0005, ess>=3825; cross-checked against a hand-
    rolled Metropolis sampler, rhat<=1.026, ess>=296): panel posterior 74.9
    [41.5,89.4]; every per-checkpoint and per-family posterior has
    P(gap>0)=1.0; posterior predictive for an out-of-panel architecture 65.3
    [5.9,93.3], P(gap>0)=0.996 (the check cosyvoice2_heldout used). A
    420-specification curve over exclusions x kmin x control-type x seeds x
    aggregation x outcome (240 unique populations after collapsing
    duplicates) puts the exact-rate gap between 34.4 and 86.4 points with no
    specification reversing its sign. LEAST FAVOURABLE SINGLE READING: under
    the widest group-level-scale prior tried, the out-of-panel posterior's
    lower bound is -1.63 and P(gap>0) drops to 0.956 -- the one credible
    reading anywhere in this project that touches zero.
  control_periodicity_full_panel: >
    2026-08-12 (b40ed2e). The never-cycled-control correction (see
    rivals_excluded.control_periodicity) previously covered only 4 of 6
    checkpoints, so the k=12..32 subset result sat as a footnote next to a
    6-checkpoint cycled headline. `scripts/run_aperiodic_llasa.sh` filled in
    llasa3b and llasa8b (144 new generations); the corrected headline now
    covers the whole panel and the paper LEADS with it (verified against
    numbers.tex macros \ApHeadCk=69.6, \ApHeadFam=67.6, cycled kept beside
    them as \ApHeadCkCyc=76.7 / \ApHeadFamCyc=75.4). Positive in 6/6 and 3/3
    either way, smallest checkpoint still +60. BUT most of the 7.1-point move
    is not periodicity: a never-cycled k=32 control must return 32 DISTINCT
    adverbs and the 146-word pool's tail transcribes worse than the 8-word
    cycled pool (0.79-0.85 vs 0.98-1.00 per-occurrence). Scored to within one
    unit the substitution costs 1.7 points, not 7.1, and the median-error
    contrast (which Figure 1(a) plots) does not move at all -- so 69.6/67.6
    are a FLOOR, the truth is bracketed between them and 76.7/75.4, and both
    numbers are reported rather than one replacing the other. The old
    4-checkpoint k=12..32 subset figure ("13.4 points") is now 11.4 points
    over all six checkpoints. The hierarchical/mixed-effects fits still rest
    on the CYCLED arm on purpose (`hierarchical.py` asserts against
    `checkpoint_level.json`, which is cycled, by design) -- do not silently
    substitute the never-cycled numbers into those fits.
  period_ladder: >
    2026-08-12/13 (fa13a3a, 73c3113, 8f72f4f). Answers the sharpest objection
    the paper received, independently from all four r21 reviewers: the design
    varied periodicity and verbatim token identity together, so "Periodicity,
    Not Length" was a claim about the pair, not periodicity alone. A ladder
    holding carrier/word-count/requested-count fixed and varying only period p
    in {1,2,4,8}, k in {16,24,32}, 3 checkpoints (llasa1b, qwen06b, xtts2),
    n=1134 kept (verified exactly against data/results/period_ladder.json:
    kept=1134). Mean exact rate by p, averaged over the 3 checkpoints
    (recomputed directly from exact_by_period_scan and reproduces to 0.1pt):
      p=1   7.2%     p=2  49.2%     p=4  77.4%     p=8  91.6%
    Monotone in EVERY ONE of the 3 checkpoints individually, and all 5 scoring
    rules agree on the ordering. THE DECISIVE CELL IS p=2 -- no token is ever
    adjacent to itself there -- and roughly half the deficit still remains.
    SO THE TITLE STANDS, on evidence now rather than assumption.
    CAUTION, not to be smoothed away: the headline scoring rule (ordered scan)
    clears its own pre-committed "half survives" bar (D2/D1 <= 0.5) by only
    0.002 (mean_ratio=0.5019 in the JSON) and does so only because ONE
    checkpoint carries it -- per-checkpoint ordered-scan ratios are llasa1b
    0.426, xtts2 0.430, BOTH BELOW HALF, and qwen06b 0.6295 alone pulls the
    mean over the line. The two RECOUNT rules (unbounded recount, strict
    conjunction) are far more comfortable: per-checkpoint ratios 0.6895-0.8083
    across both rules (mean ~0.734-0.738) -- so the paper's claim is properly
    rested on the recount rules, with the ordered-scan number reported
    alongside as the least favourable, not as "just another rule that
    agrees." The scan/recount gap exists because `score_counts.py`'s ordered
    scan cannot detect an overcount once p>1 (a looping model reads as an
    overcount at p=1 and as spuriously EXACT at p=2) -- worth 22 points at p=2
    on its own (51.7% scanned vs 23.9% recounted). "Five scoring rules" in an
    earlier commit message was actually four: the by-family rule reproduces
    the ordered scan exactly here because every architecture family in this
    3-checkpoint ladder has exactly one representative.
    ROTATIONS WERE NOT OPTIONAL: a p=2 arm needs 2 fillers and which 2 is a
    lexical confound worth 24.4-53.3 points on qwen06b alone across rotations
    (p2_by_rotation in the JSON); generating all 8/p rotations balances
    vocabulary and character count (187.8/188.6/188.8 chars) across p=2,4,8.
    REPLICATION CHECK IS NOT UNIFORMLY EXACT: qwen06b and xtts2 reproduce
    their published p=1/p=8/p=k rungs to 0.000; llasa1b (smallest n) differs
    by -2.9/+2.8/+1.7 points -- inside sampling noise, reported as such rather
    than as a blanket "reproduces exactly."
    A SECOND RIVAL ACCOUNT DIED ALONGSIDE INDIVIDUATION (see disambiguation
    below): per-token repetition count m=k/p does not explain the curve by
    itself -- repeating each of 4 words 8 times each is far easier than
    repeating 1 word 8 times, despite twice the length at fixed m. NOTE: the
    specific "66.7% vs 0.0%" figures quoted for this comparison in the
    73c3113/8f72f4f commit prose could NOT be traced to a specific field in
    period_ladder.json during this reconciliation (the JSON's `k in
    {16,24,32}` design has no p=1,k=8 cell to pair against p=4,k=32's m=8; the
    comparison likely draws on the separate main-panel k=8 word_rep rows) --
    the qualitative claim is supported (collapse_onto_m.rank_corr_E_m=-0.739,
    i.e. exact-rate falls as m rises, which is at least consistent), but do
    not requote the specific percentages without recomputing them directly.
    Bootstrap (n_boot=4000, verified against the JSON's `bootstrap` block):
    ratio CI [0.633, 0.824], D2 CI [0.483, 0.729]. CAUTION confirmed against
    source by the 73c3113 commit: `bootstrap_ratio` is called on the
    STRICT-CONJUNCTION column, whose own ratio point estimate is 0.738 and D2
    point estimate is 0.612 -- NOT the ordered-scan headline's ratio=0.502 /
    D2=0.424. Both intervals correctly bracket the strict-conjunction rule's
    own point estimates; do not pair either interval with the 0.502/0.424
    ordered-scan points as if they were the same statistic (S28 in the
    supplement and a comment in make_numbers.py both already say so).
    File: data/results/period_ladder.json. Supplement: S28 (97 pages by the
    time it landed), documents all of the above.
    STILL OPEN as of this reconciliation: the ladder covers only 3 of the 6
    panel checkpoints (llasa1b, qwen06b, xtts2); an extension to llasa3b was
    reported as in progress in project chatter but NO
    data/results/*llasa3b*period* file exists on disk as of 2026-08-13 --
    treat as not landed, re-check before quoting a 4th checkpoint, and note
    S28 will need re-checking if/when it lands.
  disambiguation: >
    2026-08-12 (fa13a3a, updated 8f72f4f). Tests our OWN proposed mechanism
    for the dissociation -- that the decoder cannot individuate identical
    neighbours -- by inserting a comma, full stop or "and" between
    repetitions and checking whether that minimal disambiguator recovers the
    count. Verdict in the JSON: "INDIVIDUATION FALSIFIED".
    NUMBER DISCREPANCY, resolved in the JSON's favour per house rule (trust
    the JSON over the commit body): the 8f72f4f commit message says "the
    recovered fraction is 0.9%, not the 0.2% I quoted [in fa13a3a] -- the JSON
    moved as data landed." The CURRENT data/results/disambiguation.json (n=465,
    all 3 checkpoints present, matches HEAD exactly, re-verified 2026-08-13)
    gives R_matched = -0.00021352 = -0.02%, which rounds to the EXACT value
    baked into the built paper macro `\DisR{}` = "-0.0" (paper/numbers.tex:122,
    used at paper/results_body.tex:82, "...recovers -0.0%."). Neither the old
    0.2% (fa13a3a's own value, computed on the n=179 2-checkpoint precursor)
    nor the claimed-new 0.9% matches what is on disk or built into the paper
    today. THE CORRECT NUMBER TO QUOTE IS -0.0% (i.e. no recovery, direction
    if anything slightly negative), not 0.9% -- flagged to the requesting
    agent/user; do not propagate the 0.9% figure.
    Design: front_end_check confirms the disambiguator variants never produce
    a transcript identical to the bare item (identical_rate=0.0 for all three
    variants), so any null is not an artifact of the ASR ignoring the
    inserted token. judge_audit shows the judge's own delivery rate on the
    variant text is 92.6-99.1% (spread 6.6 points), i.e. the disambiguators
    are themselves speakable and transcribable. Per-checkpoint recovered
    fractions (recovered_fraction in the JSON) are mixed in sign -- comma is
    negative on 2 of 3 checkpoints (llasa1b -4.0%, xtts2 -3.1%), "and" is the
    least-bad variant (llasa1b +3.2%, qwen06b +9.4%, xtts2 0.0%) but the
    top-level R_and mean is only +4.2%, well short of a mechanism-rescuing
    effect. ordering_as_predicted=true in the JSON (the variants order the way
    a real, small individuation effect would) but the matched, pre-committed
    primary statistic (R_matched) is the one quoted in the paper and it is
    approximately zero.
