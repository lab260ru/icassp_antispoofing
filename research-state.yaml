outer_loop:
  cycle: 12
  last_direction: "h9_paired_counterfactual_ranking_protocol_locked"
  last_reflection: "H8-SF is terminal against its dominant frozen single expert. H9-PCR changes the scientific object: paired natural/synthetic source supervision is compared to exactly matched BCE and random-pair controls in one transparent model, then evaluated on two new fixed corpora. Pair availability, provenance, and the strict two-target gate are hard stops."
  pivot_policy: "After the first association/intervention matrix or five completed runs, choose deepen, broaden, pivot, or conclude and record the evidence."

