# Central state for the AR-TTS counting-collapse study.
# A fresh agent should be able to resume from THIS FILE + findings.md + README.md.
project: "Counting Collapse in Autoregressive TTS"
venue: "ICASSP 2026 (4 pages + 1 page refs)"
started: "2026-08-11"
branch: "research/ar-tts-counting-collapse"
remote: "https://github.com/lab260ru/icassp_antispoofing"

question: >
  Autoregressive TTS models mis-render text containing many repetitions
  (looping, truncating, losing count). Is this a structural consequence of the
  decoder's state dynamics under periodic conditioning rather than a sampling
  artifact? If the per-repetition state map contracts, the model provably
  cannot count past a finite horizon.

phase: "P3-refinement"   # P0 scaffold, P1 bringup, P2 sweep, P3 refinement, P4 ship

# ---------------------------------------------------------------- what is done
settled:
  lean: >
    COMPLETE and verified. 11 theorems in lean/SpectralTTS, zero sorry, axiom
    audit shows only propext / Classical.choice / Quot.sound. Gate:
    scripts/check_lean.sh. Do not re-derive; it is finished.
  theory: >
    Theorem A (i)-(iv) counting collapse + Lemma B attention dilution. The Lean
    artifact proves an IMPLICATION; the contraction premise is empirical. Keep
    that distinction explicit in all writing -- reviewers rewarded it.
  benchmark: >
    180 stimuli, data/stimuli/stimuli.jsonl, regenerable by make_stimuli.py.
    Regenerating only changes metadata, never text, so existing generations
    stay valid.
  behavioural_pipeline: "generate -> vocode (Llasa only) -> Whisper -> score_counts"

# --------------------------------------------------------------- key findings
findings_headline:
  dissociation: >
    Every model fails on repeated text where length-matched distinct-word
    controls survive. k>=6 accuracy, repeated vs control:
    llasa1b 0.07/0.30, llasa3b 0.06/0.11, xtts2 0.14/0.59,
    qwen06b 0.08/0.64, qwen17b 0.29/0.69.
  collapse_points: "k* = 0, 1, 4, 4, 8 for llasa1b, llasa3b, xtts2, qwen06b, qwen17b"
  scale_effect: "within Qwen, 0.6B -> 1.7B doubles k* (4 -> 8)"
  mechanism: >
    Representational capacity gain dN_eff/dlog k is ~0.5x on repeated text vs
    control, with disjoint 95% template-bootstrap CIs (llasa1b 22.0 vs 52.7;
    xtts2 21.6 vs 36.1). Rerunning over all 7 variants now.
  lemma_b: >
    Confirmed tightly. Renormalised over the k repeated keys: block entropy =
    0.98 log k, implied delta <= 0.06 nats, max share never exceeds 1.9/k.
  negative_result: >
    The boundary-difference estimator for q is unsound here -- deep-layer
    attention centroid advances on ~51% of steps, so boundary localisation
    dominates the measurement. Reported in the paper, code kept in
    src/common/boundaries.py.

