project:
  title: "Beyond Crest Factor: A Cross-Dataset Causal Audit of Signal Cues in Speech Anti-Spoofing"
  question: "Which interpretable waveform cues associate causally, rather than merely correlationally, with published speech anti-spoofing detector scores across datasets and architectures, and can a robust feature-conditioned head reduce harmful sensitivity?"
  status: active
  started: "2026-08-09"
  deadline_utc: "2026-08-10T18:03:00Z"
  domain: "speech anti-spoofing"
  target_venue: "ICASSP 2027"
  narrative_status: provisional

literature:
  key_papers: []
  open_problems:
    - "Whether score-feature correlations survive within-class, cross-dataset, and causal tests."
    - "Whether robust feature conditioning improves OOD generalization without creating a new shortcut."
  evidence_gaps:
    - "No result is considered confirmatory until held-out datasets are evaluated."

hypotheses:
  - id: H1
    statement: "At least one nontrivial signal cue has a directionally stable within-class association with published detector scores across datasets and architectures."
    status: active
    motivation: "Crest factor may be a shortcut, but association must be separated from class and corpus confounds."
    priority: high
  - id: H2
    statement: "Matched waveform interventions that alter a selected cue cause paired score changes in multiple detectors while preserving intelligibility and label-relevant content."
    status: pending
    motivation: "Causal sensitivity is needed before calling a correlation a detector shortcut."
    priority: high
  - id: H3
    statement: "Feature-conditioned scoring with transformation consistency improves held-out EER relative to an equivalent baseline recipe."
    status: pending
    motivation: "The audit should yield an actionable robustness intervention when evidence supports one."
    priority: medium

