    status: "10 repositories pinned incl. judge and vocoder"
    file: data/results/model_revisions.json
  causal_intervention:
    status: >
      2026-08-12. Two arms, Llasa-1B. Whole-state splicing (Arm A) came back
      "too disruptive to interpret": an unrelated donor moved the rendered
      count 1.34x as much as an informative one (cap-hit 15.8% reference vs
      37.4% patched, stop-rate 84.2% vs 62.6%). A rank-1 patch transplanting
      only the probe's count coordinate fixed the instrument: no-op self-patch
      bitwise-identical 18/18, 0% degenerate in every patched cell, stop-rate
      within 3-17 points of reference. It reads as a CLEAN NULL: cross-k at
      layer 7, +0.00 log-count [-0.09,+0.09], n=36 pairs, no opposite-sign
      up/down pattern in any cell. The ridge-steering lead from the pilot
      DIED on a full sweep: Spearman +0.044 [p=0.65], 274 generations x 9
      alphas; the repeated curve peaks mid-sweep (~15-16 rendered) and
      collapses at both extremes while length-matched controls stay flat (24
      rendered units at every alpha).
    caution: >
      the pre-committed P1 disruption gate on the rank-1 patch still literally
      returns "too disruptive" at 1.74; reported as such, flagged post-hoc as
      a degenerate ratio (both arms' extreme-alpha effect medians are exactly
      0.0, so the gate divides by ~nothing rather than detecting violence).
      See mechanism_status for the full account.
    script: analysis/causal_count.py, analysis/causal_count_followup.py
    file: data/results/causal_count.json, data/results/causal_count_followup.json
  stop_head:
    status: >
      2026-08-12. Negative. Instrumentation is sound (EOS logits exact to
      0.075 nats against the instrumented pass, 4/4 planted positive controls
      recovered with zero spurious attribution, commonality decomposition
      additive to 1e-16) but the duration/count predictors are INSEPARABLE on
      Llasa-1B (canonical correlation 0.970 at low k, above the pre-committed
      0.95 threshold) and INCONCLUSIVE on Llasa-8B (0.635) -- the checkpoints
      disagree on which direction the collinearity even moves. An alignment
      bug in the instrumentation (hidden/attn sliced [plen:] vs logits from
      [plen-1:-1], off by one generation step) was found and fixed while
      building it; it failed quietly, 0.075 nats reconstruction error shifted
      vs 3.55 unshifted.
    script: analysis/stop_head.py
    file: data/results/stop_head.json
  independent_judge:
    status: >
      2026-08-12. 4 recognisers, gap 65.1-76.7, positive in 6/6 checkpoints
      and 3/3 families under every one. Decisive argument is arm spread, not
