outer_loop:
  cycle: 3
  last_direction: "pivot_toward_negative_crest_result_and_association_atlas"
  last_reflection: "Five explicit H1 tables now complete the configured aggregate. The discovery-frozen Spectra crest candidate is directionally negative in four of five corpora but fails both-confirmation requirements because its ASVspoof5 adjusted estimate is null. Nineteen other registered feature/view/class units meet the descriptive five-corpus association rule, but confirmation outcomes cannot trigger post-hoc H2 expansion. Preserve the already-started crest H2 run as exploratory only. It may test paired score sensitivity, but it cannot rescue the failed H1 portability claim and cannot meet the registered causal criterion until a fourth parity-validated scorer exists."
  pivot_policy: "After the first association/intervention matrix or five completed runs, choose deepen, broaden, pivot, or conclude and record the evidence."

