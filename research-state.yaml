review_round_1:
  location: "paper/reviews/r1/"
  addressed: >
    stale abstract claim, method/results mismatch, table caption, audit-bucket
    framing, broken citations, internal path in a bib note, outcome taxonomy,
    LaTeX escape in a caption, code availability, author block.
  outstanding:
    - "panel breadth: fixed as models land"
    - "naturalness/perplexity confound not separately controlled (controls at high k are also unnatural word salad -- state this)"
    - "acoustic/codec-token repetition attractor as an alternative locus: not ruled out"
    - "Lemma B and Theorem A not experimentally separated"

final_day_results:
  probe_past_horizon:
    status: >
      1 of 5 checkpoints; llasa1b loses the count, llasa3b llasa8b qwen06b
      qwen17b do not. 12 repeated + 12 control items each, seed 0.
    caution: >
      MAE ratios against the constant predictor: llasa1b 1.01, llasa3b 0.99,
      llasa8b 0.86, qwen06b 0.74, qwen17b 0.90. llasa3b is on the 'keeps the
      count' side of the threshold by 0.006 over 12 items, which is not a margin,
      so probe_past_horizon.py applies a TIE = 0.02 band: llasa1b and llasa3b are
      called INDISTINGUISHABLE from a constant predictor and llasa8b, qwen06b,
      qwen17b clearly keep the count. By effect size 2 of 5 show nothing
      recoverable. The paper quotes 1 of 5, the less favourable reading; S12
      records both. Anything in the repo still saying '1 of 2' or '1 of 3'
      predates the qwen runs.
    scale_contrast: >
      DEAD. 'Scale buys a persistent counter' held within Llasa (1.01 -> 0.99 ->
      0.86 as size rises) and INVERTS within Qwen (0.6B 0.74 -> 1.7B 0.90). Two
      families, opposite directions, three points each. Do not write it.
    length_confound: >
      READ BEFORE QUOTING THE QWEN RATIOS. A predictor given only log(trajectory
      length) beats the state probe on both Qwen checkpoints (0.30 vs 0.37 at
      0.6B, 0.36 vs 0.45 at 1.7B) and loses on all three Llasa ones. 6 of
      qwen06b's 12 repeated items run to the 8192-token budget and they are the
      high-k ones, so length carries k on its own. Against that baseline the Qwen
      'keeps the count' readings are not evidence about the representation.
    file: data/results/probe_horizon_compare.json
    range_confound: >
      ruled out on every checkpoint, not just llasa1b: all five control arms beat
      the constant predictor over the identical k (0.86, 0.83, 0.59, 0.95, 0.89).
    script: analysis/probe_past_horizon.py
  greedy_decoding:
    status: "deficit survives argmax: gap 72.2 vs 75.0 sampled, cap-hit 0% both arms"
    script: analysis/greedy_decoding.py
  sample_sizes:
    status: "5400 -> 2052 -> 1559 -> 982 = 457 + 525, reconciled and asserted"
    script: analysis/sample_sizes.py
  horizon_ratio:
    status: >
      direction form-independent, magnitude form-dependent -- pooled ratio
      3.1 (tanh) to 5.4 (hyperbolic). SUPERSEDED by the qwen hit_cap fix: was
      2.7-4.3; do not requote.
    script: analysis/horizon_forms.py
  exclusion_sensitivity:
    status: "gap 61.7 with every rule off vs 76.1 as reported"
    script: analysis/exclusion_sensitivity.py
  vits_config:
    status: "immunity holds at 3 duration-predictor settings; sign not size"
    script: analysis/vits_config.py
  duration_intervention:
    status: >
      F5-TTS handed the total duration a correct rendering takes (read off its
      OWN control at the same k, never off the repeated item -- that would be
      circular). Exact-rate, n=90/arm at k>=6: overall 25.6 -> 36.7; k<12
      43.3 -> 76.7 (+33.3 pts, n=30/arm); k>=12 16.7 -> 16.7 (+0.0, n=60/arm),
      and the intervention arm is at 0.0% at k=24 and k=32. Duration estimation
      accounts for much of the low-k deficit and NONE of the high-k one.
    trap: >
      fix_duration is reference + generated seconds, not generated alone. Passing
      the target directly asks for a total shorter than the reference clip and
      the model emits near-silence -- which is what the first run produced.
    script: analysis/duration_intervention.py
    generator: src/models/f5_fixdur.py
    file: data/results/duration_intervention.json
  model_revisions:
    status: "10 repositories pinned incl. judge and vocoder"
    file: data/results/model_revisions.json
  causal_intervention:
    status: >
      2026-08-12. Two arms, Llasa-1B. Whole-state splicing (Arm A) came back
      "too disruptive to interpret": an unrelated donor moved the rendered
      count 1.34x as much as an informative one (cap-hit 15.8% reference vs
      37.4% patched, stop-rate 84.2% vs 62.6%). A rank-1 patch transplanting
      only the probe's count coordinate fixed the instrument: no-op self-patch
      bitwise-identical 18/18, 0% degenerate in every patched cell, stop-rate
      within 3-17 points of reference. It reads as a CLEAN NULL: cross-k at
      layer 7, +0.00 log-count [-0.09,+0.09], n=36 pairs, no opposite-sign
      up/down pattern in any cell. The ridge-steering lead from the pilot
      DIED on a full sweep: Spearman +0.044 [p=0.65], 274 generations x 9
      alphas; the repeated curve peaks mid-sweep (~15-16 rendered) and
      collapses at both extremes while length-matched controls stay flat (24
      rendered units at every alpha).
    caution: >
      the pre-committed P1 disruption gate on the rank-1 patch still literally
      returns "too disruptive" at 1.74; reported as such, flagged post-hoc as
      a degenerate ratio (both arms' extreme-alpha effect medians are exactly
      0.0, so the gate divides by ~nothing rather than detecting violence).
      See mechanism_status for the full account.
    script: analysis/causal_count.py, analysis/causal_count_followup.py
    file: data/results/causal_count.json, data/results/causal_count_followup.json
  stop_head:
    status: >
      2026-08-12. Negative. Instrumentation is sound (EOS logits exact to
      0.075 nats against the instrumented pass, 4/4 planted positive controls
      recovered with zero spurious attribution, commonality decomposition
      additive to 1e-16) but the duration/count predictors are INSEPARABLE on
      Llasa-1B (canonical correlation 0.970 at low k, above the pre-committed
      0.95 threshold) and INCONCLUSIVE on Llasa-8B (0.635) -- the checkpoints
      disagree on which direction the collinearity even moves. An alignment
      bug in the instrumentation (hidden/attn sliced [plen:] vs logits from
      [plen-1:-1], off by one generation step) was found and fixed while
      building it; it failed quietly, 0.075 nats reconstruction error shifted
      vs 3.55 unshifted.
    script: analysis/stop_head.py
    file: data/results/stop_head.json
  independent_judge:
    status: >
      2026-08-12. 4 recognisers, gap 65.1-76.7, positive in 6/6 checkpoints
      and 3/3 families under every one. Decisive argument is arm spread, not
      gap size: repeated arm's exact rate spans 1.0 pt across judges
      (17.1-18.2%), control arm spans 12.2 (82.1-94.3%). See
      findings_headline.judge_replication for the full account, including the
      correction to noise_floor.py's "11 of 13" figure.
    script: analysis/independent_judge.py
    file: data/results/independent_judge.json
  cosyvoice2:
    status: >
      2026-08-12. Fourth architecture, non-panel by design. Held-out
      prediction 65.3 [5.9,93.3] (hierarchical.json, committed 6f34945 at
      17:28) vs observed 64.4 (behavioural_cosyvoice.csv, first waveform
      18:58). Over-produces rather than truncates (median relative error
      +12.5%, 0% cap-hit) -- fails differently from the panel but still
      fails. See findings_headline.cosyvoice2_heldout.
    script: src/models/cosyvoice_gen.py, analysis/hierarchical.py
    file: data/results/hierarchical.json, data/results/behavioural_cosyvoice.csv
  hierarchical:
    status: >
      2026-08-12. Mixed-effects gap 76.4 pts, least favourable of six
      frequentist intervals excludes zero at 63.2 pts. Hierarchical Bayes
      panel posterior 74.9 [41.5,89.4]; out-of-panel posterior predictive 65.3
      [5.9,93.3], P(gap>0)=0.996 (touches zero, P(gap>0)=0.956, only under the
      single widest group-level-scale prior tried). 420-specification curve
      (240 unique populations): gap 34.4-86.4, sign never reverses. See
      findings_headline.hierarchical_stats.
    script: analysis/hierarchical.py
    file: data/results/hierarchical.json
