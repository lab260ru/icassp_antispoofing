review_round_1:
  location: "paper/reviews/r1/"
  addressed: >
    stale abstract claim, method/results mismatch, table caption, audit-bucket
    framing, broken citations, internal path in a bib note, outcome taxonomy,
    LaTeX escape in a caption, code availability, author block.
  outstanding:
    - "panel breadth: fixed as models land"
    - "naturalness/perplexity confound not separately controlled (controls at high k are also unnatural word salad -- state this)"
    - "acoustic/codec-token repetition attractor as an alternative locus: not ruled out"
    - "Lemma B and Theorem A not experimentally separated"
