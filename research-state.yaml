outer_loop:
  cycle: 13
  last_direction: "h9_terminal_positive_result_review_and_paper"
  last_reflection: "H9-PCR passed its complete locked two-target gate after source-only selection and a sealed checkpoint handoff. The observed effect is controlled and statistically stable for the frozen ensemble but absolute EER and seed heterogeneity require a deliberately narrow paper claim. The next work is Codex-only claim review and a paper rewrite, not H9 retuning."
  pivot_policy: "After the first association/intervention matrix or five completed runs, choose deepen, broaden, pivot, or conclude and record the evidence."

