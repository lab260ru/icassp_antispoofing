project:
  title: "Same-Item Pair Ranking for Cross-Corpus Speech Deepfake Detection"
  question: "Under a frozen compact-detector protocol, does documented same-item natural--synthetic ranking lower two-target transfer error beyond same-pool BCE and equal-edge random-pair ranking?"
  status: h9_positive_result_paper_draft_ready
  started: "2026-08-09"
  deadline_utc: "2026-08-11T13:00:00Z"
  domain: "speech anti-spoofing"
  target_venue: "ICASSP 2027"
  narrative_status: h9_same_item_controlled_transfer_draft_ready

literature:
  key_papers:
    - id: yamagishi2021asvspoof
      doi: "10.21437/ASVSPOOF.2021-8"
      role: "Challenge conditions and unmatched 2021 evaluation context."
    - id: muller2024harder
      doi: "10.21437/Interspeech.2024-247"
      role: "Motivates multi-corpus generalization analysis."
    - id: pascu2024generalizable
      doi: "10.21437/Interspeech.2024-1302"
      role: "Motivates the conditional frozen-SSL mitigation direction."
    - id: pan2022speaker
      doi: "10.21437/Interspeech.2022-72"
      role: "Motivates evaluating environmental-cue sensitivity causally."
  open_problems:
    - "Whether score-feature correlations survive within-class, cross-dataset, and causal tests."
    - "Whether robust feature conditioning improves OOD generalization without creating a new shortcut."
  evidence_gaps:
    - "The original H2 panel completed quality screening but failed its locked 90% per-arm retention gate; it has no score-eligible manifest or paired detector-score result."
    - "Any future H2 study requires a new outer-loop protocol, score-independent freeze, validated quality-preserving arm family, and a fourth runnable scorer for the registered four-model causal criterion."

hypotheses:
  - id: H1
    statement: "At least one nontrivial signal cue has a directionally stable within-class association with published detector scores across datasets and architectures."
    status: five_corpus_aggregate_complete_crest_candidate_not_portable
    motivation: "Crest factor may be a shortcut, but association must be separated from class and corpus confounds."
    priority: high
  - id: H2
    statement: "Matched waveform interventions that alter a selected cue cause paired score changes in multiple detectors while preserving intelligibility and label-relevant content."
    status: quality_gate_failed_no_detector_scores
    motivation: "Causal sensitivity is needed before calling a correlation a detector shortcut."
    priority: high
  - id: H3
    statement: "Feature-conditioned scoring with transformation consistency improves held-out EER relative to an equivalent baseline recipe."
    status: not_authorized_no_valid_h2_sensitivity_result
    motivation: "The audit should yield an actionable robustness intervention when evidence supports one."
    priority: medium
  - id: H2B
    statement: "A separately calibrated, score-blinded waveform transformation family can meet the strict paired quality contract before any detector is allowed to score it."
    status: q1_complete_no_transform_family_eligible
    motivation: "The original H2 arms failed quality gates, so validity of a cue-directed perturbation must be established independently before a future causal study."
    priority: high
  - id: H4
    statement: "Registered waveform features may have corpus-dependent raw label separation even when no detector score is read."
    status: complete_23_atlas_only_stable_label_associations
    motivation: "A descriptive label--cue transportability atlas can contextualize corpus dependence without reopening failed intervention loops."
    priority: medium
  - id: H5
    statement: "Registered feature measurements may or may not remain invariant across three waveform views under a fresh score-free sample freeze."
    status: complete_17_terminal_view_stable_units_6_explicit_degenerate_cells
    motivation: "A paired view-invariance atlas can contextualize feature-view sensitivity without reading labels, scores, models, or audio."
    priority: medium
  - id: H6
    statement: "Published anti-spoofing score artifacts exhibit measurable within-class rank-agreement heterogeneity across models and corpora."
    status: complete_280_cell_score_agreement_atlas
    motivation: "A descriptive score-agreement atlas tests the value of the eight-model panel without using waveform features or reopening association selection."
    priority: medium
  - id: H7
    statement: "A fixed 28-feature full-waveform logistic baseline has corpus-dependent leave-one-corpus-out label transfer under a fresh source-ID freeze."
    status: complete_descriptive_feature_only_transfer_matrix
    motivation: "Tests full fixed-vector feature-label transportability without detector scores, feature selection, or causal interpretation."
    priority: medium
  - id: H8
    statement: "A fresh, literature-grounded training or representation strategy can deliver a verified positive cross-corpus anti-spoofing result under a newly locked protocol."
    status: complete_failed_dominant_single_model_falsification
    motivation: "The completed association/quality-gate paper is not sufficient as the primary ICASSP contribution; H8 permits a clean pivot rather than post-hoc repair."
    priority: highest
  - id: H9
    statement: "Documented same-item natural-to-synthetic ranking supervision lowers cross-corpus anti-spoofing EER relative to ordinary BCE and an equal-edge random-pair ranking control under the frozen H9 protocol."
    status: complete_positive_terminal_gate_passed
    motivation: "A documented same-item pair comparison tests whether the pairing key helps while holding the compact transparent architecture, data volume, batch schedule, and margin term fixed; it does not itself prove a linguistic or causal internal mechanism."
    priority: highest

