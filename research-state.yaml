# Six rival explanations for the periodicity-specific deficit, each with the
# analysis that killed it. A new agent should not re-litigate these.
rivals_excluded:
  length: "matched controls at the same word count come back exact; analysis/count_error.py"
  control_periodicity: >
    main-ladder controls cycle an 8-word pool above k=8. SUPERSEDED (partial
    panel, kept for the record): ~~re-generated k=12..32 from a never-cycled
    146-word pool on 4 of 6 checkpoints: gap +71.2 vs +84.6 pts, confound worth
    13.4 points~~. As of 2026-08-12 (b40ed2e) the never-cycled generation
    covers all 6 checkpoints and the paper LEADS with the de-confounded
    headline: 69.6 pts by checkpoint / 67.6 by family (vs 76.7 / 75.4 cycled),
    i.e. the confound over the full panel is worth ~7.1 (checkpoint) / ~7.8
    (family) points, most of which is a vocabulary-difficulty artifact of the
    146-word pool's tail rather than periodicity itself (substitution cost 1.7
    pts, not 7.1, under a within-one-unit criterion). See
    findings_headline.control_periodicity_full_panel for the full account.
    analysis/aperiodic_controls.py
  repetition_penalty: >
    Llasa passes NO penalty and shows the effect at full size (14.0 vs 92.9);
    XTTS-v2 across a 4x penalty range holds at 15.6-21.1%.
    analysis/penalty_confound.py
  asr_judge: >
    A non-AR model through the SAME judge on the SAME strings shows no gap.
    Also: two recognisers disagree by 0.47 counts and ours reports the HIGHER
    count in 11/13 disagreements, so it under-states the deficit.
    analysis/nonar_baseline.py, analysis/noise_floor.py
  architecture: >
    NOT EXCLUDED -- withdrawn 2026-08-12. Two non-AR baselines disagree: VITS
    shows no dissociation (-6.7) but F5-TTS shows +60.0, growing with k as the
    panel's does. Absence of an autoregressive decoder confers no immunity. The
    replacement hypothesis (post-hoc): what matters is whether the count must be
    held internally, not recurrence. It has since had ONE direct test -- the
    F5-TTS duration intervention, see final_day_results.duration_intervention --
    which splits: supplying the total length lifts exact-rate 43.3 -> 76.7 at
    k<12 and 16.7 -> 16.7 at k>=12. Still post-hoc, still one checkpoint.
    analysis/nonar_baseline.py
  improbability_and_acoustics: "ruled out by their own predictions; supplement S8"
  individuation: >
    2026-08-12 (fa13a3a). OUR OWN proposed mechanism -- that the decoder
    cannot individuate identical neighbours, so a minimal local disambiguator
    (comma/full-stop/"and" between repetitions) should recover the count --
    tested and killed. Verdict "INDIVIDUATION FALSIFIED" in
    data/results/disambiguation.json; recovered fraction ~-0.0% (see
    findings_headline.disambiguation for the number-discrepancy note -- the
    commit message's "0.9%" does not match the JSON). Proposed from VITS's
    immunity, F5-TTS's duration split and the causal null; better tested than
    shipped. analysis/disambiguation.py
  per_token_count_m_eq_k_over_p: >
    2026-08-12 (8f72f4f, period ladder report). A second account died
    alongside individuation: per-token repetition count m=k/p does not
    explain the curve by itself -- repeating each of 4 words 8 times each is
    much easier than repeating 1 word 8 times despite twice the length at the
    same m. Qualitatively supported by period_ladder.json
    (collapse_onto_m.rank_corr_E_m=-0.739); the specific percentages quoted in
    commit prose could not be traced to a JSON field during this
    reconciliation -- see findings_headline.period_ladder's caution.

